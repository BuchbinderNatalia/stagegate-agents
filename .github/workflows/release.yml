# SPDX-License-Identifier: Apache-2.0
# Release: on a v* tag, build the release tarball (the file install.sh downloads),
# its SHA-256, a build-provenance attestation, and a DRAFT GitHub release for a
# human to review and publish.
#
# Verify a download:  gh attestation verify stagegate-agents-vX.Y.Z.tar.gz \
#                       --repo BuchbinderNatalia/stagegate-agents
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read # checkout only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Build release tarball + checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          name="stagegate-agents-${TAG}"
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" "$TAG"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          cat "dist/${name}.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" "$@"
