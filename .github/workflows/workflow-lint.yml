# SPDX-License-Identifier: Apache-2.0
# Lints this repo's workflows AND the deploy workflow stagegate generates for users:
# actionlint (correctness) + zizmor (security: injection, permissions, pinning).
name: Workflow lint

on:
  pull_request:
    paths: [".github/**", "templates/workflows/**", "scripts/render*.py"]
  push:
    branches: [main]
    paths: [".github/**", "templates/workflows/**", "scripts/render*.py"]
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dev tools (exact versions, hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - name: Render the generated deploy workflows
        run: python scripts/render_examples.py "$RUNNER_TEMP/rendered"
      - name: actionlint
        # Generated files are passed explicitly: outside a git repo, actionlint
        # finds "no project" and exits 0 without checking anything.
        run: |
          "$RUNNER_TEMP/actionlint" -color
          "$RUNNER_TEMP/actionlint" -color "$RUNNER_TEMP"/rendered/*/.github/workflows/*.yml
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low .github/workflows "$RUNNER_TEMP"/rendered/*/.github/workflows
